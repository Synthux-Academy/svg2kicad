<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG to KiCad</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>SVG → KiCad</h1>
      <p class="subtitle">Drop an SVG, pick a layer, copy, then paste (Ctrl/Cmd+V) into KiCad's PCB editor.</p>

      <div id="dropZone" class="drop-zone" tabindex="0">
        <p id="dropZoneText">Drag an SVG here, or click to browse</p>
        <input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden>
      </div>

      <div id="fileName" class="file-name" hidden></div>

      <div id="statsPanel" class="stats-panel" hidden>
        <div class="stat">
          <span class="stat-label">Edge.Cuts</span>
          <span id="statEdge" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span id="statMaskLabel" class="stat-label">Artwork shapes</span>
          <span id="statMask" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Ring-bridged holes</span>
          <span id="statRing" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Skipped</span>
          <span id="statSkipped" class="stat-value">0</span>
        </div>
      </div>

      <div id="controls" class="controls" hidden>
        <label for="layerSelect">Artwork layer</label>
        <select id="layerSelect">
          <optgroup label="Common" id="commonLayers"></optgroup>
          <optgroup label="More layers" id="moreLayers" hidden></optgroup>
        </select>
        <button type="button" id="moreLayersToggle" class="link-button">Show more layers</button>

        <label class="checkbox-label" for="ledWindowCheck">
          <input type="checkbox" id="ledWindowCheck">
          LED window / touch pad (+ copper keep-out)
        </label>
        <select id="ledWindowSelect" hidden>
          <option value="front">F.Mask + keep-out</option>
          <option value="back">B.Mask + keep-out</option>
          <option value="both">F.Mask + B.Mask + keep-out</option>
          <option value="touch">Touch pad: F.Cu + F.Mask + keep-out</option>
          <option value="covered">Covered touch pad: F.Cu + keep-out</option>
        </select>

        <label for="anchorSelect">Anchor point (paste origin)</label>
        <select id="anchorSelect">
          <option value="none">None (SVG origin)</option>
          <option value="top-left">Top-left</option>
          <option value="top-center" selected>Top-center</option>
          <option value="top-right">Top-right</option>
          <option value="middle-left">Middle-left</option>
          <option value="center">Center</option>
          <option value="middle-right">Middle-right</option>
          <option value="bottom-left">Bottom-left</option>
          <option value="bottom-center">Bottom-center</option>
          <option value="bottom-right">Bottom-right</option>
        </select>

        <label for="scaleInput">Scale (1 = 1:1)</label>
        <input type="number" id="scaleInput" class="scale-input" value="1" min="0.001" step="any">

        <button type="button" id="copyBtn" class="copy-button" disabled>Copy to Clipboard</button>
        <span id="copyStatus" class="copy-status"></span>
      </div>

      <textarea id="clipboardStaging" class="clipboard-staging" readonly></textarea>
    </aside>

    <section class="preview">
      <div class="preview-panel">
        <h2 class="preview-title">SVG source</h2>
        <div id="svgPreview" class="preview-box empty">
          <p class="preview-placeholder">Drop an SVG to preview it here.</p>
        </div>
      </div>
      <div class="preview-panel">
        <h2 class="preview-title">KiCad shapes</h2>
        <div id="kicadPreview" class="preview-box kicad-preview-box empty">
          <p class="preview-placeholder">Converted shapes will appear here.</p>
        </div>
      </div>
    </section>
  </div>

  <script src="converter.js" defer></script>
  <script src="ui.js" defer></script>
</body>
</html>
